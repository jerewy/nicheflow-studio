<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NicheFlow Capture Settings</title>
    <style>
      body { font: 15px system-ui, sans-serif; margin: 32px; max-width: 520px; color: #172033; }
      label { display: block; font-weight: 650; margin-bottom: 8px; }
      select, button { font: inherit; padding: 8px 12px; }
      button { margin-left: 8px; cursor: pointer; }
      #status { color: #15803d; min-height: 24px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <h1>NicheFlow Capture</h1>
    <p>Click the extension icon while viewing an Instagram Reel to send it directly to this pool.</p>
    <label for="niche">Default pool</label>
    <select id="niche">
      <option value="history">History</option>
      <option value="movie">Movie</option>
    </select>
    <button id="save" type="button">Save</button>
    <div id="status" role="status"></div>
    <script src="options.js"></script>
  </body>
</html>
